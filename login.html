<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login | CarleyNStrength</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/logoG.jpg" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
</head>
<body class="portal-body">

  <!-- Hero -->
  <div class="portal-hero">
    <a href="index.html">
      <img src="images/logo.png" alt="CarleyNStrength" class="logo-sm" />
    </a>
    <h1>Welcome back</h1>
    <p>Log in to see your progress, workouts, and check-ins.</p>
  </div>

  <!-- Login card -->
  <div class="portal-card">
    <h2>Sign in</h2>
    <p class="sub">Good to see you again. Let's see how far you've come.</p>

    <div class="portal-msg" id="error-msg"></div>

    <form id="login-form" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@email.com" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required autocomplete="current-password" />

      <button type="submit" class="btn-portal">Sign in</button>
    </form>

    <div class="link-row">
      Don't have an account yet? <a href="signup.html">Sign up here</a>
    </div>
    <div class="link-row" style="margin-top: 10px;">
      <a href="index.html">&larr; Back to website</a>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpju8JIedURVxBJgmZ1yBuRzd4CEdFDVY",
    authDomain: "carleynfitnesscalendar.firebaseapp.com",
    projectId: "carleynfitnesscalendar",
    storageBucket: "carleynfitnesscalendar.appspot.com",
    messagingSenderId: "1013642078015",
    appId: "1:1013642078015:web:e8bcff9d1559f1c1d5158a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.className = "portal-msg error show";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.className = "portal-msg";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const credential = await signInWithEmailAndPassword(auth, email, password);
      const user = credential.user;
      window.location.href = user.email === "carleynfitness@gmail.com" ? "admin.html" : "dashboard.html";
    } catch (err) {
      const messages = {
        "auth/invalid-email":      "That email doesn't look right — double-check it.",
        "auth/user-not-found":     "No account found with that email.",
        "auth/wrong-password":     "Incorrect password. Give it another go.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/too-many-requests":  "Too many attempts — please wait a moment and try again."
      };
      showError(messages[err.code] || "Something went wrong. Please try again.");
    }
  });
</script>

</body>
</html>
