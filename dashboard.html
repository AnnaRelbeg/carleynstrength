<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Dashboard | CarleyNStrength</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/CNF_Dashboard.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

</head>
<body class="dash-body">

  <!-- ===================== HOME VIEW ===================== -->
  <div id="view-home" class="dashboard-wrap">

    <!-- Hero banner -->
    <div class="dash-hero">
      <div class="level-badge">⭐ <span id="level-name">Level 1</span></div>
      <h1 id="dash-greeting">Hey!</h1>
      <p class="coach-msg" id="coach-msg">Loading your stats...</p>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="xp-bar" style="width:0%"></div>
      </div>
      <div class="xp-labels">
        <span id="xp-current">0 XP</span>
        <span id="xp-next">Next level: 200 XP</span>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card-portal">
        <div class="big-num" id="streak-num">0</div>
        <div class="label">🔥 Streak</div>
      </div>
      <div class="stat-card-portal">
        <div class="big-num" id="weekly-workouts">0</div>
        <div class="label">💪 This week</div>
      </div>
      <div class="stat-card-portal">
        <div class="big-num" id="total-xp-display">0</div>
        <div class="label">⭐ Total XP</div>
      </div>
    </div>

    <!-- 7-day dot calendar -->
    <div class="week-row" id="week-row"></div>

    <!-- Weekly challenge -->
    <div class="dash-card">
      <h3>Weekly Challenge</h3>
      <div class="challenge-wrap">
        <div class="challenge-label">
          <span id="challenge-text">Log 3 workouts this week</span>
          <span id="challenge-count">0 / 3</span>
        </div>
        <div class="challenge-bar">
          <div class="challenge-fill" id="challenge-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Quick log buttons -->
    <div class="quick-actions">
      <button class="quick-btn" onclick="openModal('modal-workout')">
        <span class="icon">🏋️</span>
        <span class="q-title">Log Workout</span>
        <span class="q-sub">Track your session</span>
      </button>
      <button class="quick-btn" onclick="openModal('modal-meal')">
        <span class="icon">🍽️</span>
        <span class="q-title">Log Meals</span>
        <span class="q-sub">Track your macros</span>
      </button>
      <button class="quick-btn" onclick="openModal('modal-metrics')">
        <span class="icon">📊</span>
        <span class="q-title">Body Metrics</span>
        <span class="q-sub">Measurements</span>
      </button>

    </div>

    <!-- Achievements -->
    <div class="dash-card">
      <h3>🏆 Achievements</h3>
      <div class="achievements-grid" id="achievements-grid"></div>
    </div>

    <!-- 7-day activity log -->
    <div class="dash-card">
      <h3>📅 Last 7 Days</h3>
      <div id="activity-list"></div>
    </div>

  </div>


  <!-- ===================== PROFILE VIEW ===================== -->
  <div id="view-profile" class="dashboard-wrap" style="display:none; padding-top:0;">

    <div class="dash-hero" style="border-radius:0;">
      <h1 id="profile-heading" style="font-size:1.3rem;">My Profile</h1>
      <p style="opacity:0.8; font-size:0.85rem;" id="profile-email-display"></p>
    </div>

    <form id="profile-form" style="padding:16px;">
      <div class="dash-card" style="margin:16px 0;">
        <h3>Your Details</h3>

        <div class="profile-field">
          <label>Full name</label>
          <input type="text" id="fullName" readonly />
        </div>
        <div class="profile-field">
          <label>Goal</label>
          <input type="text" id="goal" placeholder="What are you working towards?" />
        </div>
        <div class="profile-field">
          <label>Daily calorie target (kcal)</label>
          <input type="number" id="calorieTarget" min="800" max="4000" step="10" placeholder="e.g. 1400" />
        </div>
        <div class="profile-field">
          <label>Start date</label>
          <input type="date" id="startDate" />
        </div>
        <div class="profile-field">
          <label>Notes from Carley</label>
          <textarea id="notes" rows="4" readonly style="resize:none;"></textarea>
        </div>
        <div class="profile-field" id="workout-plan-wrap" style="display:none;">
          <label>Your Workout Plan</label>
          <textarea id="workoutPlan" rows="6" readonly style="resize:none;white-space:pre-wrap;"></textarea>
        </div>

        <div class="portal-msg" id="profile-msg"></div>
        <button type="submit" class="btn-portal" style="margin-top:4px;">Save changes</button>
      </div>
    </form>

    <div style="padding:0 16px 24px;">
      <button id="logoutBtn" style="width:100%; background:none; border:1.5px solid #e0e8f0; border-radius:14px; padding:15px; font-family:'Montserrat',sans-serif; font-size:0.95rem; font-weight:700; color:#708090; cursor:pointer;">
        Log out
      </button>
    </div>

  </div>




  <!-- ===================== MODALS ===================== -->

  <!-- Workout Modal -->
  <div class="modal-overlay" id="modal-workout" onclick="handleOverlayClick(event, 'modal-workout')">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeModal('modal-workout')">✕</button>
      <h2 class="modal-title">🏋️ Log Workout</h2>
      <form id="workoutLogForm">
        <label for="workoutDate">Date</label>
        <input type="date" id="workoutDate" required />

        <label for="workoutType">Type</label>
        <select id="workoutType">
          <option>Strength</option>
          <option>Cardio</option>
          <option>Mobility / Stretching</option>
          <option>HIIT</option>
          <option>Walk / Run</option>
          <option>Other</option>
        </select>

        <label for="duration">Duration (minutes)</label>
        <input type="number" id="duration" min="5" max="300" placeholder="e.g. 45" required />

        <label for="workoutNotes">Notes (optional)</label>
        <textarea id="workoutNotes" rows="2" placeholder="How did it go? Any PBs?"></textarea>

        <div class="portal-msg" id="workout-msg"></div>
        <button type="submit" class="btn-submit">Log it</button>
      </form>
    </div>
  </div>

  <!-- Meal Modal -->
  <div class="modal-overlay" id="modal-meal" onclick="handleOverlayClick(event, 'modal-meal')">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeModal('modal-meal')">✕</button>
      <h2 class="modal-title">🍽️ Log Meals</h2>
      <form id="mealLogForm">
        <label for="mealDate">Date</label>
        <input type="date" id="mealDate" required />

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label for="calories">Calories (kcal)</label>
            <input type="number" id="calories" required placeholder="e.g. 1400" />
          </div>
          <div>
            <label for="protein">Protein (g)</label>
            <input type="number" id="protein" required placeholder="e.g. 120" />
          </div>
          <div>
            <label for="carbs">Carbs (g)</label>
            <input type="number" id="carbs" required placeholder="e.g. 150" />
          </div>
          <div>
            <label for="fat">Fat (g)</label>
            <input type="number" id="fat" required placeholder="e.g. 55" />
          </div>
          <div>
            <label for="fibre">Fibre (g)</label>
            <input type="number" id="fibre" placeholder="e.g. 28" />
          </div>
        </div>

        <div class="portal-msg" id="meal-msg"></div>
        <button type="submit" class="btn-submit">Log it</button>
      </form>
    </div>
  </div>

  <!-- Metrics Modal -->
  <div class="modal-overlay" id="modal-metrics" onclick="handleOverlayClick(event, 'modal-metrics')">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeModal('modal-metrics')">✕</button>
      <h2 class="modal-title">📊 Body Metrics</h2>

      <label for="metricsDate">Date</label>
      <input type="date" id="metricsDate" style="margin-bottom:16px;" />

      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button type="button" id="loadMetricsBtn" style="flex:1; background:#eef2f6; border:none; border-radius:10px; padding:11px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.82rem; color:#2c3e50; cursor:pointer;">Load for date</button>
      </div>

      <form id="metricsForm">
        <div class="metrics-modal-grid">
          <div class="metric-input-wrap">
            <label>Weight (kg)</label>
            <input type="number" id="m-weight" step="0.1" placeholder="e.g. 68.5" />
          </div>
          <div class="metric-input-wrap">
            <label>Waist (cm)</label>
            <input type="number" id="m-waist" step="0.1" placeholder="e.g. 74" />
          </div>
          <div class="metric-input-wrap">
            <label>Hip (cm)</label>
            <input type="number" id="m-hip" step="0.1" placeholder="e.g. 96" />
          </div>
          <div class="metric-input-wrap">
            <label>Chest (cm)</label>
            <input type="number" id="m-chest" step="0.1" placeholder="e.g. 88" />
          </div>
          <div class="metric-input-wrap">
            <label>Thigh (cm)</label>
            <input type="number" id="m-thigh" step="0.1" placeholder="e.g. 56" />
          </div>
          <div class="metric-input-wrap">
            <label>Arm (cm)</label>
            <input type="number" id="m-arm" step="0.1" placeholder="e.g. 30" />
          </div>
          <div class="metric-input-wrap">
            <label>Glutes (cm)</label>
            <input type="number" id="m-glutes" step="0.1" placeholder="e.g. 100" />
          </div>
        </div>

        <div class="portal-msg" id="metrics-msg"></div>
        <button type="submit" class="btn-submit">Save metrics</button>
      </form>

      <div id="metrics-history" style="margin-top:20px;">
        <p style="font-size:0.75rem; font-weight:700; color:#708090; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;">Recent entries</p>
        <div id="metrics-history-list"></div>
      </div>
    </div>
  </div>



  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-view="home">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>

    <button class="bottom-nav-item" data-view="profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs,
  Timestamp, query, orderBy, limit, arrayUnion
} from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpju8JIedURVxBJgmZ1yBuRzd4CEdFDVY",
  authDomain: "carleynfitnesscalendar.firebaseapp.com",
  projectId: "carleynfitnesscalendar",
  storageBucket: "carleynfitnesscalendar.firebasestorage.app",
  messagingSenderId: "1013642078015",
  appId: "1:1013642078015:web:e8bcff9d1559f1c1d5158a"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Helpers ──────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function toDateTS(dateStr) {
  return Timestamp.fromDate(new Date(dateStr + "T00:00:00"));
}
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "portal-msg " + type + " show";
}
function clearMsg(id) {
  const el = document.getElementById(id);
  if (el) el.className = "portal-msg";
}

// ── XP & Level system ────────────────────────────
const LEVELS = [
  { name: "Just Starting",  min: 0    },
  { name: "Building Habits",min: 200  },
  { name: "Getting Consistent", min: 500  },
  { name: "Dedicated",      min: 1000 },
  { name: "Strong & Steady",min: 2000 },
  { name: "Elite",          min: 4000 }
];
function getLevel(xp) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (xp >= LEVELS[i].min) return { index: i, ...LEVELS[i], next: LEVELS[i+1] };
  }
  return { index: 0, ...LEVELS[0], next: LEVELS[1] };
}
function updateXPBar(xp) {
  const level = getLevel(xp);
  document.getElementById("level-name").textContent = level.name;
  document.getElementById("total-xp-display").textContent = xp;
  document.getElementById("xp-current").textContent = xp + " XP";
  if (level.next) {
    const pct = Math.min(100, Math.round((xp - level.min) / (level.next.min - level.min) * 100));
    document.getElementById("xp-bar").style.width = pct + "%";
    document.getElementById("xp-next").textContent = "Next: " + level.next.min + " XP";
  } else {
    document.getElementById("xp-bar").style.width = "100%";
    document.getElementById("xp-next").textContent = "Max level!";
  }
}

// ── Carley's coach messages ───────────────────────
const PROTEIN_TARGET = 100; // g
const CAL_TOL = 200;

function coachMessage(stats) {
  const { totalWorkouts, highProteinDays, onTargetCalDays, daysWithMeals,
          avgProtein, avgCalories, calTarget, daysConsidered } = stats;

  const goodProtein = avgProtein >= PROTEIN_TARGET;
  const goodCals = calTarget && Math.abs(avgCalories - calTarget) <= CAL_TOL;

  if (totalWorkouts >= 5 && goodProtein && goodCals) {
    return "You've absolutely nailed this week. Workouts, protein, calories — all there. I'm so proud of you. Keep going. 🙌";
  }
  if (totalWorkouts >= 4 && (goodProtein || goodCals)) {
    return "Brilliant week. Four sessions in and your nutrition is looking great too. You should feel really good about this. 💪";
  }
  if (totalWorkouts >= 3) {
    if (goodProtein) return "Three sessions and your protein's on point — your body is absolutely loving you right now. Proper solid week. 🌟";
    if (goodCals)    return "Three workouts and your calories are dialled in. That's exactly the combo we're after. Well done you. ✨";
    return "Three sessions done — brilliant. Let's get the nutrition sharper and things will really start to shift. You've got this. 🎯";
  }
  if (totalWorkouts >= 1) {
    if (goodProtein || highProteinDays >= Math.ceil(daysConsidered / 2)) {
      return "You showed up and your protein followed. That's the duo we love. Let's build on it. 🎤";
    }
    if (goodCals || onTargetCalDays >= Math.ceil(daysConsidered / 2)) {
      return "Calories mostly on track — great start. Add another session when you can and we're flying. 👩‍🍳";
    }
    return "You showed up. That's the hardest part — and you did it. Let's build on that this week. 💛";
  }
  if (daysWithMeals > 0 && (goodProtein || goodCals)) {
    return "Nutrition's being tracked — that's such an underrated habit. Your trainers miss you though. 👟";
  }
  return "Hey, no pressure at all. Whenever you're ready, I'm here. Even a 10-minute walk counts — it really does. 😊";
}

// ── Achievements ─────────────────────────────────
const ALL_ACHIEVEMENTS = [
  { id: "first_workout",  label: "First Workout",    icon: "🏋️", condition: (s) => s.totalEverWorkouts >= 1 },
  { id: "first_meal",     label: "First Log",        icon: "🍽️", condition: (s) => s.totalEverMeals >= 1 },
  { id: "first_metric",   label: "First Metric",     icon: "📊", condition: (s) => s.totalEverMetrics >= 1 },

  { id: "streak_3",       label: "3-Day Streak",     icon: "🔥", condition: (s) => s.streak >= 3 },
  { id: "streak_7",       label: "7-Day Streak",     icon: "🔥", condition: (s) => s.streak >= 7 },
  { id: "workouts_10",    label: "10 Workouts",      icon: "💪", condition: (s) => s.totalEverWorkouts >= 10 },
  { id: "workouts_25",    label: "25 Workouts",      icon: "🏆", condition: (s) => s.totalEverWorkouts >= 25 },
  { id: "protein_week",   label: "Protein Week",     icon: "🍗", condition: (s) => s.highProteinDays >= 5 },
  { id: "xp_500",         label: "500 XP",           icon: "⭐", condition: (s) => s.totalXP >= 500 },
  { id: "xp_1000",        label: "1000 XP",          icon: "🌟", condition: (s) => s.totalXP >= 1000 },
];

function renderAchievements(stats) {
  const grid = document.getElementById("achievements-grid");
  grid.innerHTML = "";
  ALL_ACHIEVEMENTS.forEach(a => {
    const unlocked = a.condition(stats);
    const el = document.createElement("div");
    el.className = "achievement" + (unlocked ? " unlocked" : "");
    el.innerHTML = `<span>${a.icon}</span><span>${a.label}</span>`;
    el.title = unlocked ? "Unlocked!" : "Keep going!";
    grid.appendChild(el);
  });
}

// ── 7-day dot row ─────────────────────────────────
function renderWeekRow(workoutsByDay, mealsByDay, metricssByDay) {
  const row = document.getElementById("week-row");
  row.innerHTML = "";
  const dayLetters = ["S","M","T","W","T","F","S"];
  const today = new Date();

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const letter = dayLetters[d.getDay()];
    const isToday = i === 0;
    const hasWorkout = !!workoutsByDay[key];
    const hasMeal = !!mealsByDay[key];
    const hasMetric = !!metricssByDay[key];
    const actCount = (hasWorkout ? 1 : 0) + (hasMeal ? 1 : 0) + (hasMetric ? 1 : 0);

    let cls = "week-day ";
    let emoji = "";
    if (isToday) cls += "today", emoji = "·";
    else if (actCount >= 2) cls += "done", emoji = "✓";
    else if (actCount === 1) cls += "partial", emoji = "·";
    else cls += "empty", emoji = "○";

    row.innerHTML += `
      <div class="${cls}">
        <span class="day-letter">${letter}</span>
        <div class="day-dot">${emoji}</div>
      </div>`;
  }
}

// ── Activity list (7 days) ─────────────────────────
function renderActivityList(workoutsByDay, mealsByDay) {
  const list = document.getElementById("activity-list");
  list.innerHTML = "";
  const today = new Date();

  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const label = i === 0 ? "Today" : i === 1 ? "Yesterday" : key;

    const w = workoutsByDay[key];
    const m = mealsByDay[key];
    const details = [];
    if (w && w.entries) {
      const totalMins = w.entries.reduce((s, e) => s + (parseInt(e.duration) || 0), 0);
      details.push(`🏋️ ${w.entries.map(e => e.type).join(", ")} — ${totalMins} min`);
    }
    if (m) {
      const parts = [];
      if (m.calories) parts.push(`${m.calories} kcal`);
      if (m.protein)  parts.push(`${m.protein}g protein`);
      if (parts.length) details.push(`🍽️ ${parts.join(" · ")}`);
    }

    const item = document.createElement("div");
    item.className = "activity-item";
    item.innerHTML = `
      <div class="a-icon">${details.length ? (w ? "🏋️" : "🍽️") : "○"}</div>
      <div>
        <span class="a-day">${label}</span>
        <span class="a-detail">${details.length ? details.join(" &nbsp;·&nbsp; ") : "Nothing logged"}</span>
      </div>`;
    list.appendChild(item);
  }
}

// ── Streak calculation ────────────────────────────
function calcStreak(workoutsByDay, mealsByDay, metricssByDay) {
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 90; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const hasActivity = workoutsByDay[key] || mealsByDay[key] || metricssByDay[key];
    if (hasActivity) streak++;
    else if (i > 0) break; // allow today to be empty (still building)
  }
  return streak;
}

// ── Main auth & data load ─────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }

  // Profile
  const docRef  = doc(db, "clients", user.uid);
  const docSnap = await getDoc(docRef);
  const profile = docSnap.data() || {};

  const firstName = (profile.fullName || "there").split(" ")[0];
  document.getElementById("dash-greeting").textContent = "Hey, " + firstName + "!";
  document.getElementById("profile-heading").textContent = profile.fullName || "My Profile";
  document.getElementById("profile-email-display").textContent = user.email;
  document.getElementById("fullName").value = profile.fullName || "";
  document.getElementById("goal").value = profile.goal || "";
  document.getElementById("startDate").value = profile.startDate || "";
  document.getElementById("notes").value = profile.notes || "";
  document.getElementById("calorieTarget").value = profile.calorieTarget || "";
  if (profile.workoutPlan) {
    document.getElementById("workoutPlan").value = profile.workoutPlan;
    document.getElementById("workout-plan-wrap").style.display = "block";
  }

  // Fetch last 30 days of activity
  const wRef = collection(db, "clients", user.uid, "workoutsDaily");
  const mRef = collection(db, "clients", user.uid, "mealsDaily");
  const meRef = collection(db, "clients", user.uid, "metricsDaily");

  const [wSnap, mSnap, meSnap] = await Promise.all([
    getDocs(query(wRef, orderBy("dateTS", "desc"), limit(90))),
    getDocs(query(mRef, orderBy("dateTS", "desc"), limit(90))),
    getDocs(query(meRef, orderBy("dateTS", "desc"), limit(90)))
  ]);

  const workoutsByDay = {};
  wSnap.forEach(d => { workoutsByDay[d.id] = d.data(); });
  const mealsByDay = {};
  mSnap.forEach(d => { mealsByDay[d.id] = d.data(); });
  const metricssByDay = {};
  meSnap.forEach(d => { metricssByDay[d.id] = d.data(); });

  // This-week stats (Mon–Sun)
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0,0,0,0);

  let weekWorkouts = 0, totalEverWorkouts = Object.keys(workoutsByDay).length;
  let totalEverMeals = Object.keys(mealsByDay).length;
  let totalEverMetrics = Object.keys(metricssByDay).length;
  let highProteinDays = 0, onTargetCalDays = 0, daysWithMeals = 0;
  let proteinVals = [], calVals = [];

  Object.entries(workoutsByDay).forEach(([key]) => {
    const d = new Date(key);
    if (d >= monday) weekWorkouts++;
  });

  const calTarget = profile.calorieTarget || 1400;
  const last7 = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    last7.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
  }
  last7.forEach(key => {
    const m = mealsByDay[key];
    if (m) {
      daysWithMeals++;
      if (typeof m.calories === "number") { calVals.push(m.calories); if (Math.abs(m.calories - calTarget) <= 200) onTargetCalDays++; }
      if (typeof m.protein === "number")  { proteinVals.push(m.protein); if (m.protein >= PROTEIN_TARGET) highProteinDays++; }
    }
  });
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b) => a+b, 0) / arr.length) : 0;

  // XP
  const totalXP = (totalEverWorkouts * 50) + (totalEverMeals * 30) + (totalEverMetrics * 20);
  updateXPBar(totalXP);

  // Streak
  const streak = calcStreak(workoutsByDay, mealsByDay, metricssByDay);
  document.getElementById("streak-num").textContent = streak;
  document.getElementById("weekly-workouts").textContent = weekWorkouts;

  // Weekly challenge
  const challengeTarget = 3;
  const pct = Math.min(100, Math.round(weekWorkouts / challengeTarget * 100));
  document.getElementById("challenge-count").textContent = weekWorkouts + " / " + challengeTarget;
  document.getElementById("challenge-fill").style.width = pct + "%";

  // Coach message
  document.getElementById("coach-msg").textContent = coachMessage({
    totalWorkouts: weekWorkouts, highProteinDays, onTargetCalDays,
    daysWithMeals, avgProtein: avg(proteinVals), avgCalories: avg(calVals),
    calTarget, daysConsidered: 7
  });

  // 7-day dots + activity list
  renderWeekRow(workoutsByDay, mealsByDay, metricssByDay);
  renderActivityList(workoutsByDay, mealsByDay);

  // Achievements
  renderAchievements({ totalEverWorkouts, totalEverMeals, totalEverMetrics,
    streak, highProteinDays, totalXP });

  // ── Log Workout ──
  document.getElementById("workoutDate").value = todayStr();
  document.getElementById("workoutLogForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg("workout-msg");
    const dateStr = document.getElementById("workoutDate").value;
    const log = {
      type:     document.getElementById("workoutType").value,
      duration: parseInt(document.getElementById("duration").value),
      notes:    document.getElementById("workoutNotes").value.trim(),
      loggedAt: Timestamp.now()
    };
    const ref = doc(db, "clients", user.uid, "workoutsDaily", dateStr);
    await setDoc(ref, { date: dateStr, dateTS: toDateTS(dateStr), entries: arrayUnion(log) }, { merge: true });
    showMsg("workout-msg", "Workout logged! +50 XP 🎉", "success");
    document.getElementById("workoutLogForm").reset();
    document.getElementById("workoutDate").value = todayStr();
    setTimeout(() => { closeModal("modal-workout"); location.reload(); }, 1200);
  });

  // ── Log Meal ──
  document.getElementById("mealDate").value = todayStr();
  document.getElementById("mealLogForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg("meal-msg");
    const dateStr = document.getElementById("mealDate").value;
    const log = {
      date: dateStr, dateTS: toDateTS(dateStr),
      calories: parseInt(document.getElementById("calories").value),
      protein:  parseInt(document.getElementById("protein").value),
      carbs:    parseInt(document.getElementById("carbs").value),
      fat:      parseInt(document.getElementById("fat").value),
      fibre:    document.getElementById("fibre").value ? parseInt(document.getElementById("fibre").value) : null,
      loggedAt: Timestamp.now()
    };
    const ref = doc(db, "clients", user.uid, "mealsDaily", dateStr);
    await setDoc(ref, log, { merge: true });
    showMsg("meal-msg", "Meals logged! +30 XP 🎉", "success");
    document.getElementById("mealLogForm").reset();
    document.getElementById("mealDate").value = todayStr();
    setTimeout(() => { closeModal("modal-meal"); location.reload(); }, 1200);
  });

  // ── Log Metrics ──
  document.getElementById("metricsDate").value = todayStr();
  document.getElementById("loadMetricsBtn").addEventListener("click", async () => {
    const dateStr = document.getElementById("metricsDate").value || todayStr();
    const snap = await getDoc(doc(db, "clients", user.uid, "metricsDaily", dateStr));
    const fields = ["weight","waist","hip","chest","thigh","arm","glutes"];
    const data = snap.exists() ? snap.data() : {};
    fields.forEach(f => {
      const el = document.getElementById("m-" + f);
      if (el) el.value = (typeof data[f] === "number") ? data[f] : "";
    });
    if (!snap.exists()) showMsg("metrics-msg", "No saved metrics for this date.", "error");
    else clearMsg("metrics-msg");
    await renderMetricsHistory(user.uid);
  });

  document.getElementById("metricsForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg("metrics-msg");
    const dateStr = document.getElementById("metricsDate").value || todayStr();
    const fields = ["weight","waist","hip","chest","thigh","arm","glutes"];
    const metrics = { date: dateStr, dateTS: toDateTS(dateStr), savedAt: Timestamp.now() };
    fields.forEach(f => {
      const v = document.getElementById("m-" + f)?.value;
      metrics[f] = (v !== "" && v != null) ? parseFloat(v) : null;
    });
    await setDoc(doc(db, "clients", user.uid, "metricsDaily", dateStr), metrics, { merge: true });
    showMsg("metrics-msg", "Metrics saved! +20 XP 🎉", "success");
    await renderMetricsHistory(user.uid);
    setTimeout(() => { closeModal("modal-metrics"); }, 1500);
  });

  await renderMetricsHistory(user.uid);

  // ── Profile save ──
  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg("profile-msg");
    const updated = {
      goal:          document.getElementById("goal").value.trim(),
      calorieTarget: parseFloat(document.getElementById("calorieTarget").value) || null,
      startDate:     document.getElementById("startDate").value,
    };
    await setDoc(docRef, updated, { merge: true });
    showMsg("profile-msg", "Saved!", "success");
  });

  // ── Logout ──
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });
});

// ── Metrics history render ────────────────────────
async function renderMetricsHistory(uid) {
  const listEl = document.getElementById("metrics-history-list");
  if (!listEl) return;
  const col = collection(db, "clients", uid, "metricsDaily");
  const snap = await getDocs(query(col, orderBy("dateTS", "desc"), limit(7)));
  listEl.innerHTML = "";
  snap.forEach(d => {
    const r = d.data();
    const parts = [];
    if (typeof r.weight === "number") parts.push("⚖️ " + r.weight);
    if (typeof r.waist  === "number") parts.push("📏 " + r.waist);
    if (typeof r.hip    === "number") parts.push("🧵 " + r.hip);
    const el = document.createElement("div");
    el.className = "metrics-history-item";
    el.innerHTML = `<strong>${d.id}</strong> <span>${parts.length ? parts.join(" · ") : "—"}</span>`;
    listEl.appendChild(el);
  });
}


</script>

<script>
// ── View switching (bottom nav) ───────────────────
const views = { home: "view-home", profile: "view-profile" };

document.querySelectorAll(".bottom-nav-item[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.view;
    document.querySelectorAll(".bottom-nav-item").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    Object.entries(views).forEach(([key, id]) => {
      document.getElementById(id).style.display = (key === target) ? "" : "none";
    });
    window.scrollTo(0, 0);
  });
});

// ── Modal helpers ─────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
  document.body.style.overflow = "";
}
function handleOverlayClick(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}
// Expose globally for onclick attributes
window.openModal = openModal;
window.closeModal = closeModal;
window.handleOverlayClick = handleOverlayClick;
</script>
